<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UFT-8" />
    <title>WINK 2주차 과제</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- head 안에. 없으면 모바일에서 PC 화면을 축소해서 보여줍니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <h1>WINK PLAY OTT</h1>
      <nav>
        <a href="#">홈</a>
        <a href="#">영화</a>
        <a href="#">시리즈</a>
        <a href="#">찜</a>
      </nav>

      <form>
        <label for="name"></label>
        <input
          type="text"
          id="name"
          placeholder="영화/드라마 제목을 입력하세요."
          required
        />
        <button type="submit">검색</button>
      </form>

      <div class="Menu">
        <button>프로필</button>
      </div>
    </header>

    <main>
      <section>
        WINK 추천 콘텐츠
        <div class="top_movie">
          <article>
            <img
              src="./images/Movie_1.jpg"
              alt="언젠가는 슬기로울 전공의생활"
            />
            <h4>언젠가는 슬기로울 전공의생활</h4>
            <button>재생</button>
            <button>즐겨찾기</button>
          </article>

          <article>
            <img src="./images/Movie_2.jpg" alt="사랑의 불시착" />
            <h4>사랑의 불시착</h4>
            <button>재생</button>
            <button>즐겨찾기</button>
          </article>

          <article>
            <img src="./images/Movie_3.jpg" alt="그 해 우리는" />
            <h4>그 해 우리는</h4>
            <button>재생</button>
            <button>즐겨찾기</button>
          </article>

          <article>
            <img src="./images/Movie_4.jpg" alt="눈물의 여왕" />
            <h4>눈물의 여왕</h4>
            <button>재생</button>
            <button>즐겨찾기</button>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
